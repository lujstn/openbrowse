name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Compile check
        run: PYTHONPATH=. uv run python -m compileall -q openbrowse tests scripts
      - name: Tests
        run: PYTHONPATH=. uv run pytest -q
