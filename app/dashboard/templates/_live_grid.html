{% for s in live_sessions %}
<a class="grid-tile" href="/session/{{ s.id }}" data-session-id="{{ s.id }}">
  <div class="grid-tile-feed">
    <iframe src="{{ s.live_url }}" tabindex="-1" scrolling="no"></iframe>
  </div>
  <div class="grid-tile-label">
    <span class="status status-{{ s.status }}"
      ><span class="status-dot"></span> {{ s.status }}</span
    >
    <span class="badge">{{ s.model or 'sonnet' }}</span>
  </div>
</a>
{% endfor %}
