{% extends "base.html" %} {% block title %}Sessions — Browser Use Pi{% endblock
%} {% block head %}
<style>
  .live-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .grid-tile {
    display: block;
    background: #111;
    border: 1px solid #222;
    border-radius: 8px;
    overflow: hidden;
  }
  .grid-tile:hover {
    border-color: #333;
    text-decoration: none;
  }
  .grid-tile-feed {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  .grid-tile-feed iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    pointer-events: none;
  }
  .grid-tile-label {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 8px 10px;
  }
  .live-grid-empty {
    color: #666;
    font-size: 13px;
    padding: 24px 0;
  }
  .section-label {
    color: #666;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 4px 0 12px;
  }
</style>
{% endblock %} {% block content %}
<h1>Sessions <span class="badge">{{ total }}</span></h1>

<div class="section-label">Live</div>
<div id="live-grid" class="live-grid"></div>
<div id="live-grid-empty" class="live-grid-empty" style="display: none">
  No live sessions
</div>

<div class="section-label">History</div>
<div
  hx-ext="sse"
  sse-connect="/sse/sessions"
  sse-swap="sessions"
  hx-target="#session-rows"
  hx-swap="innerHTML"
>
  <table>
    <thead>
      <tr>
        <th></th>
        <th>Name</th>
        <th>Session ID</th>
        <th>Profile ID</th>
        <th>Started</th>
        <th>Duration</th>
        <th>Cost (USD)</th>
      </tr>
    </thead>
    <tbody id="session-rows">
      {% include "_session_rows.html" %}
    </tbody>
  </table>
</div>

<script>
  (function () {
    const grid = document.getElementById("live-grid");
    const empty = document.getElementById("live-grid-empty");
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[c];
      });
    }
    function liveViewUrl(u) {
      const m = String(u || "").match(/\/vnc\/([^/]+)\//);
      if (!m) return "";
      const id = m[1];
      return `/vnc/${id}/view?path=vnc/${id}/websockify`;
    }
    function buildTile(item) {
      const a = document.createElement("a");
      a.className = "grid-tile";
      a.href = "/session/" + item.id;
      a.setAttribute("data-session-id", item.id);
      const feed = document.createElement("div");
      feed.className = "grid-tile-feed";
      const iframe = document.createElement("iframe");
      iframe.src = liveViewUrl(item.liveUrl);
      iframe.setAttribute("tabindex", "-1");
      iframe.setAttribute("scrolling", "no");
      feed.appendChild(iframe);
      const label = document.createElement("div");
      label.className = "grid-tile-label";
      label.innerHTML =
        '<span class="status status-' +
        esc(item.status) +
        '"><span class="status-dot"></span> ' +
        esc(item.status) +
        '</span><span class="badge">' +
        esc(item.model || "sonnet") +
        "</span>";
      a.appendChild(feed);
      a.appendChild(label);
      return a;
    }
    function reconcile(items) {
      const incoming = new Set(items.map((i) => i.id));
      grid.querySelectorAll(".grid-tile").forEach((tile) => {
        if (!incoming.has(tile.getAttribute("data-session-id"))) tile.remove();
      });
      items.forEach((item) => {
        if (
          !grid.querySelector(
            '.grid-tile[data-session-id="' + CSS.escape(item.id) + '"]'
          )
        ) {
          grid.appendChild(buildTile(item));
        }
      });
      empty.style.display = grid.querySelector(".grid-tile") ? "none" : "";
    }
    const src = new EventSource("/sse/live-grid");
    src.addEventListener("live-grid", function (e) {
      try {
        reconcile(JSON.parse(e.data));
      } catch (err) {}
    });
  })();
</script>
{% endblock %}
