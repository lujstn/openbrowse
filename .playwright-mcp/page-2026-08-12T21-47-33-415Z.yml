                - paragraph [ref=e155]: "\"The gap between having an idea and acting on it is genuinely small here. You're expected to move fast, bring your own urgency, and not wait for permission. The people around you operate the same way: high-energy, high-integrity, and never settling for good enough. Being surrounded by that every day raises your own standards and keeps raising them.\""
