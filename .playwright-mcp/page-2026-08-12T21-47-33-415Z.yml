              - paragraph [ref=e163]: Data Analytics Lead
              - paragraph [ref=e164]: “Innovation is at the core of everything we do. We ringfence time every week to experiment and explore, protected from day-to-day delivery. If we discover an opportunity to drive better outcomes, we have the autonomy to act on it. Increasingly, the most valuable discoveries are happening through AI. AI is a strategic priority and our commitment to it is only accelerating. The people who thrive here don't just lean into new initiatives. They actively drive them.”
          - group [ref=e165]:
            - generic [ref=e170]:
              - heading [level=3] [ref=e171]: Vik
